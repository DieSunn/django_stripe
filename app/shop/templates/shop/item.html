<!DOCTYPE html>
<html>
<head>
    <title>{{ item.name }}</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; display: flex; justify-content: center; background-color: #f6f9fc;}
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        h1 { margin-top: 0; }
        button { background: #5469d4; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #455ac0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ item.name }}</h1>
        <p>{{ item.description }}</p>
        <p><strong>Цена:</strong> {{ item.display_price }} {{ item.currency }}</p>
        <button id="buy-button">Купить</button>
    </div>

    <script type="text/javascript">
        var stripe = Stripe('{{ STRIPE_PUBLIC_KEY }}');
        var buyButton = document.getElementById('buy-button');

        buyButton.addEventListener('click', function() {
            fetch('/buy/{{ item.id }}/', {method: 'GET'})
            .then(response => response.json())
            .then(session => stripe.redirectToCheckout({ sessionId: session.id }))
            .catch(error => console.error('Ошибка:', error));
        });
    </script>
</body>
</html>
